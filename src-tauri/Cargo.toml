[package]
name = "gameon-timer"
version = "0.2.0"
description = "GameOn console store timer, session management and POS billing"
authors = ["GameOn"]
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "gameon_timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Keep the minor version in step with @tauri-apps/api and @tauri-apps/cli.
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
tauri-plugin-dialog = "2.8"
sha2 = "0.11.1"
uuid = { version = "1.29.0", features = ["v4"] }
thiserror = "2"

# Small, fast binaries — https://v2.tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
